name: 컴포넌트 요청
description: 새 컴포넌트나 기존 컴포넌트의 variant·prop 추가를 요청한다.
title: "[컴포넌트] "
labels: ["request:component"]
body:
  - type: markdown
    attributes:
      value: |
        화면에서 raw 요소로 직접 만들지 말고 여기에 요청한다. lint 가 그런 코드를 막는다.
  - type: input
    id: requester
    attributes:
      label: 요청한 곳
      description: 프로젝트 이름과 화면(또는 에이전트 세션). 예) atlas-web /settings
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 종류
      options:
        - 새 컴포넌트
        - 기존 컴포넌트에 variant 추가
        - 기존 컴포넌트에 prop·동작 추가
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 대상 컴포넌트
      description: 기존 컴포넌트를 바꾸는 경우 파일 이름. 예) card.tsx
  - type: textarea
    id: need
    attributes:
      label: 필요한 이유
      description: 어떤 화면에서 무엇을 하려는데 지금 컴포넌트로 안 되는지.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: 원하는 모양과 동작
      description: 상태(기본·hover·비활성 등), 키보드 동작, 참고 링크나 스크린샷.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 지금 쓰는 임시 방법
      description: 없으면 비워 둔다.
